name: PR Title Lint

# The repo only supports squash-merge (squash_merge_commit_title: PR_TITLE,
# squash_merge_commit_message: BLANK), so the PR title is the only text that
# becomes the commit message on main, and python-semantic-release parses that
# message to decide whether/how to bump the version. This must stay in sync
# with the commit-msg hook's allowed types in .pre-commit-config.yaml.

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            perf
            ci
            build
            revert
