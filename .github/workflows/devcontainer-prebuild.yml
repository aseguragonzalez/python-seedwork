name: Devcontainer prebuild

on:
  push:
    branches: [main]
    paths:
    - .devcontainer/**

permissions:
  contents: read
  packages: write

jobs:
  prebuild:
    name: Build and push devcontainer cache image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push devcontainer image
      uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
      with:
        imageName: ghcr.io/aseguragonzalez/python-seedwork-devcontainer
        push: always
        runCmd: "true"
