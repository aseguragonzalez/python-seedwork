name: Devcontainer quality

on:
  pull_request:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer-quality.yml'

permissions:
  contents: read

jobs:
  devcontainer-quality:
    name: Install and check (inside devcontainer)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run quality gate inside devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          cacheFrom: ghcr.io/aseguragonzalez/python-seedwork-devcontainer
          push: never
          runCmd: |
            make install
            make check
