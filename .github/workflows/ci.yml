name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          ignore-nothing-to-cache: true

      - name: Cache virtual environment
        id: venv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-3.12-${{ hashFiles('uv.lock') }}

      - name: Sync dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: uv sync

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          ignore-nothing-to-cache: true

      - name: Restore virtual environment cache
        id: venv-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-3.12-${{ hashFiles('uv.lock') }}

      - name: Sync dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: uv sync

      - name: Run Ruff check
        run: uv run ruff check src tests docs/examples

      - name: Run Ruff format check
        run: uv run ruff format --check src tests docs/examples

  typecheck:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          ignore-nothing-to-cache: true

      - name: Restore virtual environment cache
        id: venv-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-3.12-${{ hashFiles('uv.lock') }}

      - name: Sync dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: uv sync

      - name: Run Pyright
        run: uv run pyright

  test:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          ignore-nothing-to-cache: true

      - name: Restore virtual environment cache
        id: venv-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}

      - name: Sync dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: uv sync

      - name: Run tests
        run: uv run pytest --tb=short -q --cov=src/seedwork --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false
