name: Docs

# NOTE: The gh-pages branch must exist and GitHub Pages must be enabled in
# repo Settings → Pages → Source: Deploy from branch `gh-pages`.

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (e.g. 0.4.0)"
        required: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine whether to deploy
        id: gate
        run: |
          # Tag pushes and manual dispatches always deploy. A plain push to
          # main only deploys if it actually touched the docs sources — the
          # top-level `paths` filter can't express this OR condition together
          # with the `tags` trigger, since GitHub ANDs all filters within a
          # single `on.push` block.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.before }}" "${{ github.event.after }}" | grep -qE '^(docs/|mkdocs\.yml$)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup UV
        if: steps.gate.outputs.deploy == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        if: steps.gate.outputs.deploy == 'true'
        run: uv sync

      - name: Configure git identity
        if: steps.gate.outputs.deploy == 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Resolve version
        if: steps.gate.outputs.deploy == 'true'
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            raw="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            raw="${{ github.ref_name }}"
          else
            raw="$(uv run python -m semantic_release version --print-last-released)"
          fi
          echo "value=${raw#v}" >> $GITHUB_OUTPUT

      - name: Deploy docs
        if: steps.gate.outputs.deploy == 'true'
        run: uv run mike deploy --push --update-aliases ${{ steps.version.outputs.value }} latest

      - name: Set default version
        if: steps.gate.outputs.deploy == 'true'
        run: uv run mike set-default --push latest
